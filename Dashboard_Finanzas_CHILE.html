      <rect width="7" height="7" fill="${s.color}" opacity=".15"/><line x1="0" y1="0" x2="0" y2="7" stroke="${s.color}" stroke-width="3" opacity=".85"/></pattern>`;
  });
  let g=`<defs>${defs}</defs>`;
  const unit=!!opts.unit, isUsd=!!opts.usd;
  const fmtY=isUsd?(v=>"US$"+(v/1000).toFixed(0)+"K"):(unit?(v=>Math.round(v).toLocaleString("es-CL")):fK);
  const fmtT=isUsd?(v=>"US$ "+Math.round(v).toLocaleString("es-CL")):(unit?(v=>Math.round(v).toLocaleString("es-CL")+" u"):f0);
  for(let i=0;i<=4;i++){const val=max-(span*i/4);const yy=padT+(H-padT-padB)*i/4;
    g+=`<line x1="${padL}" y1="${yy}" x2="${W-padR}" y2="${yy}" stroke="#262c3d" stroke-dasharray="2 4"/>
        <text x="${padL-8}" y="${yy+4}" font-size="11.5" font-weight="600" fill="#aab2c8" text-anchor="end">${fmtY(val)}</text>`;}
  const bw=gw*0.66/series.length;
  months.forEach((m,i)=>{
    const gx=padL+gw*i+gw*0.17;
    const isP=i===pIdx;
    series.forEach((s,si)=>{
      const v=s.data[i]; if(v==null) return; const yy=y(Math.max(v,0)), h=Math.abs(y(v)-y0);
      const fill=isP?`url(#h${U}_${si})`:`url(#g${U}_${si})`;
      g+=`<rect x="${(gx+bw*si).toFixed(1)}" y="${(v>=0?yy:y0).toFixed(1)}" width="${(bw*0.9).toFixed(1)}" height="${Math.max(h,1).toFixed(1)}" rx="3" fill="${fill}" ${isP?'opacity=".92"':''}><title>${m} · ${s.name}: ${fmtT(v)}${isP?' (en curso)':''}</title></rect>`;
    });
    g+=`<text x="${(padL+gw*i+gw/2).toFixed(1)}" y="${H-padB+17}" font-size="11.5" fill="${isP?'#a78bfa':'#aab2c8'}" text-anchor="middle" font-weight="${isP?'700':'400'}">${m}</text>`;
    if(isP)g+=`<text x="${(padL+gw*i+gw/2).toFixed(1)}" y="${H-padB+30}" font-size="9" fill="#a78bfa" text-anchor="middle" font-weight="700">EN CURSO</text>`;
  });
  g+=`<line x1="${padL}" y1="${y0}" x2="${W-padR}" y2="${y0}" stroke="#475069"/>`;
  // line series (margen %, unidades, etc.)
  const _lines=opts.lines||(opts.line?[opts.line]:[]);
  _lines.forEach(L=>{
    const ld=L.data, lmax=Math.max(...ld.filter(v=>v!=null))*1.25||1;
    const ly=v=>padT+(lmax-v)/lmax*(H-padT-padB);
    const sfx=L.suffix||"";
    const fmtV=v=>L.dec!=null?v.toFixed(L.dec):Math.round(v).toLocaleString("es-CL");
    if(L.points){
      // solo puntos (marcadores), sin línea
      ld.forEach((v,i)=>{const isP=pIdx===i;const cx=(padL+gw*i+gw/2).toFixed(1),cy=ly(v).toFixed(1);
        g+=`<circle cx="${cx}" cy="${cy}" r="5" fill="${L.color}" stroke="#0b0d14" stroke-width="1.6" ${isP?'opacity=".75"':''}><title>${months[i]} · ${L.name}: ${fmtV(v)}${sfx}${isP?' (en curso)':''}</title></circle>`;
        g+=`<text x="${cx}" y="${(+cy-11).toFixed(1)}" font-size="12.5" fill="#ffffff" text-anchor="middle" font-weight="800" paint-order="stroke" stroke="#0b0d14" stroke-width="4" stroke-linejoin="round">${fmtV(v)}</text>`;});
    } else {
      const pts=ld.map((v,i)=>v==null?null:`${(padL+gw*i+gw/2).toFixed(1)},${ly(v).toFixed(1)}`).filter(Boolean);
      const solid=pIdx>=0?pts.slice(0,pIdx+1):pts;
      g+=`<polyline points="${solid.join(' ')}" fill="none" stroke="${L.color}" stroke-width="2.4"/>`;
      if(pIdx>=0&&pIdx<ld.length)g+=`<polyline points="${pts.slice(pIdx).join(' ')}" fill="none" stroke="${L.color}" stroke-width="2.4" stroke-dasharray="3 4" opacity=".7"/>`;
      ld.forEach((v,i)=>{if(v==null)return;g+=`<circle cx="${(padL+gw*i+gw/2).toFixed(1)}" cy="${ly(v).toFixed(1)}" r="3" fill="#0b0d14" stroke="${L.color}" stroke-width="2"><title>${months[i]} · ${L.name}: ${fmtV(v)}${sfx}</title></circle>`;});
    }
    if(L.axis){for(let i=0;i<=4;i++){const val=lmax-(lmax*i/4);const yy=padT+(H-padT-padB)*i/4;
      g+=`<text x="${W-padR+8}" y="${yy+3}" font-size="11" font-weight="600" fill="${L.color}" text-anchor="start">${val.toFixed(0)}${sfx}</text>`;}}
  });
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto">${g}</svg>`;
}
function dashDate(){const b=document.querySelector(".sub b");if(!b)return null;const p=b.textContent.trim().split("/");return p.length===3?{d:+p[0],m:+p[1],y:+p[2]}:null;}
function runRate(v){const t=dashDate();if(!t||!t.d)return null;const dim=new Date(t.y,t.m,0).getDate();return v/t.d*dim;}
function deltaTag(cur,prev){if(cur==null||!prev)return"";const dl=(cur-prev)/Math.abs(prev)*100;const up=dl>=0;return `<b style="color:${up?"#34d399":"#f87171"}">${up?"\u25B2":"\u25BC"} ${Math.abs(dl).toFixed(0)}%</b>`;}
function expCSV(btn){const card=btn.closest(".card");const tbl=btn.parentElement.querySelector("table");if(!tbl)return;const rows=[];tbl.querySelectorAll("tr").forEach(tr=>{rows.push([...tr.children].map(c=>'"'+c.textContent.trim().replace(/"/g,'""')+'"').join(","));});const name=(card&&card.querySelector("h2")?card.querySelector("h2").textContent.trim():"tabla").normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^\w ]/g,"").trim().replace(/ +/g,"_");const a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\ufeff"+rows.join("\n")],{type:"text/csv;charset=utf-8"}));a.download=(name||"tabla")+".csv";a.click();}
function kpiHtml(arr){return '<div class="kpis">'+arr.map(k=>`<div class="kpi ${k.k||''}"><div class="l">${k.l}</div><div class="v ${k.cls||''}">${k.v}</div><div class="s">${k.s||''}</div></div>`).join("")+'</div>';}
function structHtml(items){
  const tot=sum(items.map(i=>i[1]));
  return '<div class="struct">'+items.map(it=>{
    const w=it[1]/tot*100;
    return `<div class="srow"><div class="sname">${it[0]}</div><div class="strack"><div class="sfill" style="width:${w}%;background:linear-gradient(90deg,${it[2]},${it[2]}bb)"></div></div><div class="sval">${f0(it[1])} <small>· ${w.toFixed(1)}%</small></div></div>`;
  }).join("")+`<div style="font-size:11px;color:var(--muted);margin-top:8px">Total costos del período: <b style="color:var(--ink)">${f0(tot)}</b></div>`;
}
function monthTable(d, cols){
  const pIdx=d.partial?d.months.length-1:-1;
  let h="<thead><tr><th>Mes</th>"+cols.map(c=>`<th>${c.h}</th>`).join("")+"</tr></thead><tbody>";
  d.months.forEach((m,i)=>{
    const isP=i===pIdx;
    h+=`<tr class="${isP?'partial':''}"><td>${m}${isP?'<span class="tag">en curso</span>':''}</td>`+cols.map(c=>{const v=c.get(i);return `<td class="${c.cls?c.cls(v):''}">${c.fmt(v,i)}</td>`;}).join("")+"</tr>";
  });
  h+=`<tr class="tot"><td>TOTAL</td>`+cols.map(c=>`<td>${c.tot?c.tot():''}</td>`).join("")+"</tr></tbody>";
  return `<div class="tbl-wrap"><button class="csvbtn" onclick="expCSV(this)">⬇ CSV</button><table>${h}</table></div>`;
}
function chartCard(title,d,accent){
  const marg=d.ventas.map((v,i)=>v?d.resNeto[i]/v*100:0);
  const svg=svgBars(d.months,[
    {name:"Facturación",color:accent,data:d.ventas,flat:true}
  ],{partialIndex:d.partial?d.months.length-1:-1,lines:[
    {name:"Margen Neto",data:marg,color:"#34d399",axis:true,suffix:"%",dec:1},
    {name:"Unidades",data:d.envios,color:"#c7cde0",points:true}
  ]});
  return `<div class="card"><h2><span class="dot" style="background:${accent}"></span>${title}</h2>${svg}
    <div class="legend">
      <span><i style="background:${accent}"></i>Facturación</span>
      <span><i style="background:#c7cde0;border-radius:50%"></i>Pedidos</span>
      <span><i style="background:#34d399"></i>Margen Neto %</span>
      <span><i class="hatch"></i>Mes en curso</span>
    </div></div>`;
}
function costBreakdown(struct, vT, rnT){
  const totC=sum(struct.map(i=>i[1]));
  const bal=Math.max(vT-totC-rnT,0);
  const pct=v=>v/vT*100;
  const segs=struct.map(it=>[it[0],it[1],it[2]]);
  segs.push(["Impuestos y otros",bal,"#64748b"]);
  segs.sort((a,b)=>b[1]-a[1]);
  let bar='<div class="cbar">';
  segs.forEach(it=>{const w=pct(it[1]);bar+=`<div class="cseg" style="width:${w}%;background:${it[2]}"><span>${w>=7?Math.round(w)+'%':''}</span><div class="ctip">${it[0]}: ${f0(it[1])} · ${w.toFixed(1)}% de ventas</div></div>`;});
  const rnPct=pct(rnT);
  bar+=`<div class="cseg cmarg" style="width:${Math.max(rnPct,0)}%;background:#34d399"><span>${rnPct>=7?Math.round(rnPct)+'%':''}</span><div class="ctip">Resultado Neto: ${f0(rnT)} · ${rnPct.toFixed(1)}%</div></div></div>`;
  let list='<div class="clist">';
  segs.forEach(it=>{const w=pct(it[1]);list+=`<div class="crow"><span class="cdot" style="background:${it[2]}"></span><span class="cname">${it[0]}</span><span class="cpct">${w.toFixed(1)}%</span><span class="camt">${f0(it[1])}</span></div>`;});
  list+=`<div class="crow cmargrow"><span class="cdot" style="background:#34d399"></span><span class="cname">Resultado Neto (lo que queda)</span><span class="cpct">${rnPct.toFixed(1)}%</span><span class="camt">${f0(rnT)}</span></div></div>`;
  const top=[...struct].sort((a,b)=>b[1]-a[1]).slice(0,3);
  const nar=`De cada <b>$100</b> facturados se van `+top.map(t=>`<b>$${Math.round(pct(t[1]))}</b> en ${t[0].toLowerCase()}`).join(", ")+`; quedan <b style="color:#34d399">$${Math.round(rnPct)} de resultado neto</b>.`;
  return `<div class="cnar">${nar}</div>${bar}<div class="cbarcap">Cada barra representa $100 de facturación · base ventas ${fK(vT)}</div>${list}`;
}
/* ===== renderers Chile ===== */
function chanTable(d,extra){
  return monthTable(d,[
    {h:"Envíos",get:i=>d.envios[i],fmt:v=>v,tot:()=>sum(d.envios)},
    {h:"P. Venta MIX",get:i=>d.pventa[i],fmt:f0,tot:()=>{const e=sum(d.envios);return e?f0(sum(d.ventas)/e):"—";}},
    {h:"Ventas",get:i=>d.ventas[i],fmt:f0u,tot:()=>f0u(sum(d.ventas))},
    {h:"Margen Bruto",get:i=>d.margenBruto[i],fmt:f0,cls:v=>v<0?'neg':'',tot:()=>f0(sum(d.margenBruto))},
    {h:"Res. Neto",get:i=>d.resNeto[i],fmt:f0u,cls:v=>v<0?'neg':'pos',tot:()=>f0u(sum(d.resNeto))},
    {h:"Margen %",get:i=>d.ventas[i]?d.resNeto[i]/d.ventas[i]*100:0,fmt:v=>v.toFixed(0)+"%",cls:v=>v<0?'neg':'pos',tot:()=>pc(sum(d.resNeto),sum(d.ventas))}
  ].concat(extra||[]));
}
function kpiBlock(d,label,accent){
  const li=d.months.length-1, vT=sum(d.ventas), rnT=sum(d.resNeto), enT=sum(d.envios);
  const vC=d.ventas[li], rnC=d.resNeto[li], enC=d.envios[li];
  const pj=runRate(vC), pv=d.ventas[li-1];
  return kpiHtml([
    {l:"Facturación · "+d.months[li]+" (en curso)",v:usd(vC),s:f0(vC),k:"k-curso"},
    {l:"Proyección "+d.months[li]+" · run-rate",v:pj!=null?usd(pj):"—",s:(pj!=null&&pv?deltaTag(pj,pv)+" vs "+d.months[li-1]+" · "+f0(pj):"ritmo diario × días del mes"),k:"k-blue"},
    {l:"Rentabilidad · "+d.months[li],v:usd(rnC),cls:rnC<0?"neg":"pos",s:pc(rnC,vC)+" margen · "+f0(rnC),k:"k-curso"},
    {l:"Pedidos · "+d.months[li],v:enC.toLocaleString("es-CL")+" ped.",s:label+" (en curso)",k:"k-curso"},
    {l:"Vendido TOTAL (período)",v:usd(vT),s:enT.toLocaleString("es-CL")+" ped. · "+f0(vT),k:"k-gold"}
  ]);
}
function renderSH(){
  const d=DATA.shop, vT=sum(d.ventas), rnT=sum(d.resNeto);
  let h=kpiBlock(d,"Shopify","#1e6fb8");
  h+='<div class="grid2">'+chartCard("Facturación · Pedidos · Margen (Shopify)",d,"#38bdf8")+
     `<div class="card"><h2><span class="dot" style="background:#f59e0b"></span>Estructura de costos · a dónde va cada $100</h2>${costBreakdown(d.struct,vT,rnT)}</div></div>`;
  h+=`<div class="card"><h2><span class="dot" style="background:#38bdf8"></span>Detalle mensual · Shopify</h2>`+chanTable(d)+
     `<div class="note">Fuente: hoja "$ chi EERR-26". Último mes en curso: barras rayadas y fila atenuada. IVA a recuperar del período ${f0(d.ivaRecup)} · al fisco ${f0(d.fisco)}.</div></div>`;
  document.getElementById("tab_sh").innerHTML=h;
}
function renderMLC(){
  const d=DATA.ml, vT=sum(d.ventas), rnT=sum(d.resNeto), dvT=sum(d.devol);
  let h=kpiBlock(d,"Mercado Libre","#e8c46a");
  h+='<div class="grid2">'+chartCard("Facturación · Pedidos · Margen (Mercado Libre)",d,"#e8c46a")+
     `<div class="card"><h2><span class="dot" style="background:#f59e0b"></span>Estructura de costos · a dónde va cada $100</h2>${costBreakdown(d.struct,vT,rnT)}</div></div>`;
  h+=`<div class="card"><h2><span class="dot" style="background:#e8c46a"></span>Detalle mensual · Mercado Libre</h2>`+chanTable(d,[
    {h:"Devoluciones",get:i=>d.devol[i],fmt:v=>v?f0(v):"—",cls:v=>v?'neg':'',tot:()=>f0(dvT)},
    {h:"Dividendo /3",get:i=>d.dividendo[i],fmt:f0u,tot:()=>f0u(sum(d.dividendo))}
  ])+`<div class="note">Fuente: hoja "ML Finz 26". Devoluciones del período ${f0(dvT)} (${pc(dvT,vT)} de ventas). IVA a recuperar ${f0(d.ivaRecup)} · al fisco ${f0(d.fisco)}.</div></div>`;
  document.getElementById("tab_ml").innerHTML=h;
}
function renderCLT(){
  const d=DATA.cl, vT=sum(d.ventas), rnT=sum(d.resNeto), rbT=sum(d.resBruto), divT=sum(d.dividendo);
  const enSH=sum(d.enviosSH), enML=sum(d.enviosML), enT=enSH+enML;
  const li=d.months.length-1, vC=d.ventas[li], rnC=d.resNeto[li];
  const pj=runRate(vC), pv=d.ventas[li-1];
  let h=kpiHtml([
    {l:"Facturación · "+d.months[li]+" (en curso)",v:usd(vC),s:f0(vC),k:"k-curso"},
    {l:"Proyección "+d.months[li]+" · run-rate",v:pj!=null?usd(pj):"—",s:(pj!=null&&pv?deltaTag(pj,pv)+" vs "+d.months[li-1]+" · "+f0(pj):"ritmo diario × días del mes"),k:"k-blue"},
    {l:"Rentabilidad · "+d.months[li],v:usd(rnC),cls:rnC<0?"neg":"pos",s:pc(rnC,vC)+" margen · "+f0(rnC),k:"k-curso"},
    {l:"Pedidos · "+d.months[li],v:(d.enviosSH[li]+d.enviosML[li]).toLocaleString("es-CL")+" ped.",s:d.enviosSH[li]+" Shopify · "+d.enviosML[li]+" ML (en curso)",k:"k-curso"},
    {l:"Vendido TOTAL (período)",v:usd(vT),s:enT.toLocaleString("es-CL")+" ped. · "+f0(vT),k:"k-gold"}
  ]);
  const marg=d.ventas.map((v,i)=>v?d.resNeto[i]/v*100:0);
  const units=d.ventas.map((_,i)=>d.enviosSH[i]+d.enviosML[i]);
  const svg=svgBars(d.months,[{name:"Facturación",color:"#a78bfa",data:d.ventas,flat:true}],
    {partialIndex:li,lines:[{name:"Margen Neto",data:marg,color:"#34d399",axis:true,suffix:"%",dec:1},
                            {name:"Unidades",data:units,color:"#c7cde0",points:true}]});
  h+='<div class="grid2"><div class="card"><h2><span class="dot" style="background:#a78bfa"></span>Facturación · Pedidos · Margen (Shopify+ML)</h2>'+svg+
     '<div class="legend"><span><i style="background:#a78bfa"></i>Facturación</span><span><i style="background:#c7cde0;border-radius:50%"></i>Pedidos</span><span><i style="background:#34d399"></i>Margen %</span><span><i class="hatch"></i>Mes en curso</span></div></div>'+
     `<div class="card"><h2><span class="dot" style="background:#f59e0b"></span>Estructura de costos · a dónde va cada $100</h2>${costBreakdown(d.struct,vT,rnT)}</div></div>`;
  h+=`<div class="card"><h2><span class="dot"></span>Detalle mensual consolidado</h2>`+monthTable(d,[
    {h:"Env. Shopify",get:i=>d.enviosSH[i],fmt:v=>v,tot:()=>enSH},
    {h:"Env. ML",get:i=>d.enviosML[i],fmt:v=>v,tot:()=>enML},
    {h:"Ventas",get:i=>d.ventas[i],fmt:f0u,tot:()=>f0u(vT)},
    {h:"Res. Bruto",get:i=>d.resBruto[i],fmt:f0,cls:v=>v<0?'neg':'',tot:()=>f0(rbT)},
    {h:"MB %",get:i=>d.resBruto[i]/d.ventas[i]*100,fmt:v=>v.toFixed(0)+"%",cls:v=>v<0?'neg':'pos',tot:()=>pc(rbT,vT)},
    {h:"Res. Neto",get:i=>d.resNeto[i],fmt:f0u,cls:v=>v<0?'neg':'pos',tot:()=>f0u(rnT)},
    {h:"Margen %",get:i=>d.resNeto[i]/d.ventas[i]*100,fmt:v=>v.toFixed(0)+"%",tot:()=>pc(rnT,vT)},
    {h:"Dividendo /3",get:i=>d.dividendo[i],fmt:f0u,tot:()=>f0u(divT)}
  ])+`<div class="note">Fuente: hoja "CHILETECA 26". Ventas consolidadas netas de devoluciones ML. Shopify aporta ${pc(sum(DATA.shop.ventas),vT)} de la facturación del período y ML el resto. Dividendo /3 = reparto por socio (Chileteca SpA).</div></div>`;
  document.getElementById("tab_cl").innerHTML=h;
}
function show(k){
  ["sh","ml","cl"].forEach(t=>{
    document.getElementById("tab_"+t).classList.toggle("show",t===k);
    document.getElementById("bt_"+t).classList.toggle("on",t===k);
  });
  setSrc(k);
}
renderSH();renderMLC();renderCLT();setSrc("sh");

</script>
</body>
